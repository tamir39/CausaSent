model:
  pretrained: vinai/phobert-large
  dropout: 0.1

data:
  train_path: data/gold/train.json
  val_path:   data/gold/val.json
  test_path:  data/gold/test.json
  max_len: 128
  word_segmenter: vncorenlp   # vncorenlp | none

train:
  lr: 2.0e-5
  batch_size: 16
  epochs: 8
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: adamw
  class_weighting: none            # inverse_freq over-predicted rare classes (P<<R); disable for baseline
  cause_loss_weight: 1.0           # multiplier on the cause head loss
  grad_clip: 1.0
  seed: 42

output:
  ckpt_dir: checkpoints/phobert
  log_dir: runs/phobert
