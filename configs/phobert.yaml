model:
  pretrained: vinai/phobert-large
  dropout: 0.1

data:
  train_path: data/processed/train.jsonl
  val_path:   data/processed/val.jsonl
  test_path:  data/processed/test.jsonl
  max_len: 128
  word_segmenter: vncorenlp   # vncorenlp | none

train:
  lr: 2.0e-5
  batch_size: 16
  epochs: 10
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: adamw
  class_weighting: inverse_freq  # O-label dominates, so weight by inverse freq
  sent_loss_weight: 1.0          # multiplier on the sentiment head loss
  contrastive_weight: 0.0        # set > 0 to enable contrastive loss (optional)
  grad_clip: 1.0
  seed: 42

output:
  ckpt_dir: checkpoints/phobert
  log_dir: runs/phobert
